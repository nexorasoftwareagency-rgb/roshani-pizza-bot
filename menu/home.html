<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E84908">
<title>Roshani Pizza — Scan Again</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(232,73,8,.35), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(232,73,8,.18), transparent 50%),
      linear-gradient(160deg,#1a1a1a,#2a2a2a);
    color:#fff; overscroll-behavior-y:contain;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; overflow:hidden;}

  /* faint pizza-steam / glow texture */
  #app::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 50% 110%, rgba(232,73,8,.25), transparent 55%);
  }

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; position:relative; z-index:1;}
  .brand-logo{display:flex; align-items:center; gap:9px;}
  .brand-logo svg{width:30px; height:30px; color:#E84908;}
  .brand-name{font-size:18px; font-weight:900; letter-spacing:-0.02em;}
  .brand-tag{font-size:10px; font-weight:700; letter-spacing:.18em; color:rgba(255,255,255,.55); text-transform:uppercase; margin-top:2px;}

  .body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 28px 56px; position:relative; z-index:1;}

  /* QR mark — the star of the story */
  .qr-stage{position:relative; width:120px; height:120px; margin-bottom:28px;}
  .qr-halo{position:absolute; inset:-14px; border-radius:50%;
    background:radial-gradient(circle, rgba(232,73,8,.35), transparent 70%);
    animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{ 0%,100%{transform:scale(.92); opacity:.65;} 50%{transform:scale(1.06); opacity:1;} }
  .qr-tile{position:absolute; inset:0; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); border-radius:24px; backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center;}
  .qr-tile svg{width:56px; height:56px; color:#fff;}

  .headline{font-size:24px; font-weight:900; line-height:1.3; letter-spacing:-0.01em;}
  .headline .brand{color:#E84908;}
  .sub{margin-top:12px; font-size:13.5px; color:rgba(255,255,255,.7); line-height:1.7; max-width:300px;}
  .pill{margin-top:18px; display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    background:rgba(232,73,8,.15); border:1px solid rgba(232,73,8,.4); color:#fcd9c2; padding:6px 14px; border-radius:999px;}

  .btn-back{width:100%; background:linear-gradient(135deg,#FF8A3D,var(--primary,#E84908)); color:#fff; padding:16px; border:none; border-radius:14px; font-size:16px; font-weight:800; text-align:center; margin-top:36px; cursor:pointer; box-shadow:0 6px 20px rgba(232,73,8,.35);}
  .btn-back:active{background:linear-gradient(135deg,#FF8A3D,#c43d00);}
  .btn-back svg{width:16px; height:16px; vertical-align:-2px; margin-left:6px;}

  .foot{position:relative; z-index:1; padding:0 20px 22px; text-align:center; font-size:11px; color:rgba(255,255,255,.4); letter-spacing:.04em;}

  @media (prefers-reduced-motion: reduce){ .qr-halo{animation:none;} }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21C7.03 21 3 17.19 3 12.5S7.03 4 12 4s9 3.81 9 8.5S16.97 21 12 21z"/>
        <path d="M8.5 10h.01M12 8.5h.01M15.5 10h.01M9 13.5c.8.9 1.9 1.4 3 1.4s2.2-.5 3-1.4"/>
        <circle cx="8.5" cy="10" r=".8" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="8.5" r=".8" fill="currentColor" stroke="none"/>
        <circle cx="15.5" cy="10" r=".8" fill="currentColor" stroke="none"/>
      </svg>
      <div>
        <div class="brand-name">Roshani Pizza</div>
        <div class="brand-tag">Dine In Ordering</div>
      </div>
    </div>
  </div>

  <div class="body">
    <div class="qr-stage">
      <div class="qr-halo"></div>
      <div class="qr-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <path d="M14 14h3v3h-3zM21 14v.01M14 21v.01M18 18v.01M21 18v3M18 21h3"/>
        </svg>
      </div>
    </div>

    <h1 class="headline">Your table is<br>waiting for a <span class="brand">fresh scan.</span></h1>
    <p class="sub">Your ordering session ended after a quiet spell. Point your camera at the QR code on your table and we'll pick right back up — fresh as the crust.</p>
    <span class="pill">Rescan the QR · Pick Up Where You Left Off</span>

    <button class="btn-back">Rescan the QR<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM21 14v.01M14 21v.01M18 18v.01M21 18v3M18 21h3"/></svg></button>
  </div>

  <div class="foot">Roshani Pizza · Dine In Ordering</div>

</div>
</body>
</html>
